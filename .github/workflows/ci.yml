name: SmartHeating quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,report]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test frontend/schedule.test.mjs
