name: SmartHeating quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,report]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test frontend/schedule.test.mjs
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Detect a stable version bump
        id: version
        shell: bash
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: |
          current=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' pyproject.toml)
          if [[ -z "$current" ]]; then
            exit 0
          fi
          previous=$(git show "$PREVIOUS_COMMIT:pyproject.toml" | sed -nE 's/^version = "(.*)"$/\1/p')
          if [[ "$current" != "$previous" ]]; then
            echo "stable=$current" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish the stable release
        if: steps.version.outputs.stable != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.stable }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            exit 0
          fi
          python -m pip install -e '.[dev]'
          test "$(python -c 'from smartheating import __version__; print(__version__)')" = "$VERSION"
          awk -v prefix="## $VERSION " '
            /^## / { if (found) exit; found = index($0, prefix) == 1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"
          python -m smartheating.bundle
          gh release create "v$VERSION" "dist/smartheating-$VERSION-shadow.zip" \
            --target "$GITHUB_SHA" --title "SmartHeating $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
