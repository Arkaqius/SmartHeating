[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartheating"
version = "2.0.0rc3"
description = "Typed, observable multi-room heating controller for AppDaemon"
requires-python = ">=3.10"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13", "mypy==1.15.0", "PyYAML==6.0.2"]
report = ["websocket-client>=1.8,<2"]

[project.scripts]
smartheating-report = "smartheating.reporting:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["SmartHeating", "smart_heating_v2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smartheating*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/legacy"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
mypy_path = "stubs"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["legacy", "tests/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"
