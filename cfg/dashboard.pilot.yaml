title: Ogrzewanie
views:
- title: Dom
  path: smartheating
  icon: mdi:home-thermometer
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: Dom
        icon: mdi:home-thermometer
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating
      - type: button
        name: Plan i powrót
        icon: mdi:calendar-clock
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating-control
      - type: button
        name: Diagnostyka
        icon: mdi:stethoscope
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating-debug
    - type: markdown
      content: '## {{ states(''sensor.sh_actual_mode_label'') }}

        **Sterowanie:** {{ states(''sensor.sh_system_status'') }}

        {% set s = ''sensor.sh_system_summary'' %}

        Pomiary: {{ state_attr(s, ''measurements_valid'') }}/{{ state_attr(s, ''measurements_total'')
        }}

        Głowice: {{ state_attr(s, ''trvs_confirmed'') }}/{{ state_attr(s, ''trvs_total'')
        }}

        {% set problems = state_attr(s, ''problems'') %}

        {% if problems %}{% for problem in problems %}

        - {{ problem }}

        {% endfor %}{% endif %}

        {% set manual = state_attr(s, ''manual_overrides'') %}

        {% if manual %}**Ręczne ustawienia: {{ manual }}.**

        Ich termin i powrót do planu znajdziesz przy pokojach.{% endif %}

        '
    - &id001
      type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: Dom
        icon: mdi:home
        tap_action:
          action: perform-action
          perform_action: select.select_option
          target:
            entity_id: select.sh_profile
          data:
            option: home
          confirmation:
            text: Zmiana profilu zakończy ręczne nadpisania pokojów. Przejście do
              Dom anuluje termin powrotu.
      - type: button
        name: Na krótko
        icon: mdi:walk
        tap_action:
          action: perform-action
          perform_action: select.select_option
          target:
            entity_id: select.sh_profile
          data:
            option: away_short
          confirmation:
            text: Zmiana profilu zakończy ręczne nadpisania pokojów. Przejście do
              Dom anuluje termin powrotu.
      - type: button
        name: Wyjazd
        icon: mdi:bag-suitcase
        tap_action:
          action: perform-action
          perform_action: select.select_option
          target:
            entity_id: select.sh_profile
          data:
            option: away_long
          confirmation:
            text: Zmiana profilu zakończy ręczne nadpisania pokojów. Przejście do
              Dom anuluje termin powrotu.
    - type: markdown
      content: '### Zapotrzebowanie i praca kotła

        {% set rooms = state_attr(''sensor.sh_system_summary'', ''requesting_rooms'')
        %}

        **Poniżej celu:** {{ rooms | join('', '') if rooms else ''brak wskazanych
        pokojów'' }}

        **Decyzja sterownika:** {{ states(''sensor.sh_control_reason'') }}

        {% set flame = states(''sensor.boiler_flame_current_2'') %}

        **Palnik:** {% if is_number(flame) %}

        {{ ''wykryty płomień'' if flame | float > 0 else ''brak płomienia'' }}

        {% else %}brak danych{% endif %}

        {% set co = states(''binary_sensor.boiler_heating_active_2'') %}

        {% set cwu = states(''binary_sensor.boiler_tapwater_active_2'') %}

        **CO:** {{ {''on'': ''aktywne'', ''off'': ''nieaktywne''}.get(co, ''brak danych'')
        }}

        **CWU:** {{ {''on'': ''aktywne'', ''off'': ''nieaktywne''}.get(cwu, ''brak
        danych'') }}

        Odczyt nastawy potwierdza ustawienie regulatora. Temperaturę pomieszczenia
        oceniaj osobno.

        '
  - type: grid
    cards:
    - type: heading
      heading: Parter
      icon: mdi:home-floor-0
    - type: tile
      entity: climate.sh_livingroom
      name: Salon
      hide_state: true
      features:
