- title: Plan i powrót
  path: smartheating-control
  icon: mdi:calendar-clock
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: Dom
        icon: mdi:home-thermometer
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating
      - type: button
        name: Plan i powrót
        icon: mdi:calendar-clock
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating-control
      - type: button
        name: Diagnostyka
        icon: mdi:stethoscope
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating-debug
    - type: heading
      heading: Nieobecność i powrót
      icon: mdi:bag-suitcase
    - *id001
    - type: markdown
      content: 'Krótka nieobecność: podłogówka −0,5°C, grzejniki −1°C. Wyjazd: do
        18°C i 17°C. Garaż zachowuje plan.


        Wybierz termin powrotu poniżej. Aplikacja sama rozpocznie przygotowanie wcześniej
        i przejdzie do Dom o tej godzinie.'
    - type: entities
      title: Termin powrotu
      show_header_toggle: false
      entities:
      - entity: datetime.sh_arrival_at
        name: Data i godzina przyjazdu
    - type: button
      name: Anuluj termin
      icon: mdi:calendar-remove
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.sh_cancel_arrival
    - type: button
      name: Jestem w domu
      icon: mdi:home
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.sh_return_now
        confirmation:
          text: Przywrócić Dom i zakończyć ręczne nadpisania?
    - type: entities
      title: Ostatnie polecenie
      show_header_toggle: false
      entities:
      - entity: sensor.sh_command_feedback
        name: Wynik
    - type: markdown
      content: '### Plan przygotowania

        {% set arrival = state_attr(''sensor.sh_system_summary'', ''arrival'') %}

        {% if arrival %}

        Powrót: **{{ as_local(as_datetime(arrival)).strftime(''%d.%m.%Y o %H:%M'')
        }}**.

        {% if is_state(''select.sh_profile'', ''home'') %}

        Wybierz profil nieobecności, aby uruchomić przygotowanie powrotu.

        {% endif %}

        {% else %}Nie ma zaplanowanego powrotu. Nieobecność trwa do ręcznego zakończenia.{%
        endif %}


        | Pokój | Start przygotowania | Szacowana gotowość |

        | :-- | :-- | :-- |

        {% set start = state_attr(''climate.sh_livingroom'', ''preheat_start'') %}{%
        set ready = state_attr(''climate.sh_livingroom'', ''ready_at'') %}

        | Salon | {{ as_local(as_datetime(start)).strftime(''%d.%m %H:%M'') if start
        else ''—'' }} | {{ as_local(as_datetime(ready)).strftime(''%H:%M'') if ready
        and arrival else ''—'' }} |

        {% set start = state_attr(''climate.sh_corridor'', ''preheat_start'') %}{%
        set ready = state_attr(''climate.sh_corridor'', ''ready_at'') %}

        | Korytarz | {{ as_local(as_datetime(start)).strftime(''%d.%m %H:%M'') if
        start else ''—'' }} | {{ as_local(as_datetime(ready)).strftime(''%H:%M'')
        if ready and arrival else ''—'' }} |

        {% set start = state_attr(''climate.sh_bathroom'', ''preheat_start'') %}{%
        set ready = state_attr(''climate.sh_bathroom'', ''ready_at'') %}

        | Łazienka | {{ as_local(as_datetime(start)).strftime(''%d.%m %H:%M'') if
        start else ''—'' }} | {{ as_local(as_datetime(ready)).strftime(''%H:%M'')
        if ready and arrival else ''—'' }} |

        {% set start = state_attr(''climate.sh_entrance'', ''preheat_start'') %}{%
        set ready = state_attr(''climate.sh_entrance'', ''ready_at'') %}

        | Wiatrołap | {{ as_local(as_datetime(start)).strftime(''%d.%m %H:%M'') if
        start else ''—'' }} | {{ as_local(as_datetime(ready)).strftime(''%H:%M'')
        if ready and arrival else ''—'' }} |

        {% set start = state_attr(''climate.sh_upper_corridor'', ''preheat_start'')
        %}{% set ready = state_attr(''climate.sh_upper_corridor'', ''ready_at'') %}

        | Korytarz górny | {{ as_local(as_datetime(start)).strftime(''%d.%m %H:%M'')
        if start else ''—'' }} | {{ as_local(as_datetime(ready)).strftime(''%H:%M'')
        if ready and arrival else ''—'' }} |

