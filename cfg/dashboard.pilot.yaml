title: SmartHeating2.0
views:
- title: Ogrzewanie
  path: smartheating-v2
  icon: mdi:radiator
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: markdown
      content: '## SmartHeating2.0 — pilotaż

        Sterowanie aktywne po kontrolowanym przejęciu.'
  - type: grid
    cards:
    - type: entities
      title: Dom i powrót
      show_header_toggle: false
      entities:
      - entity: select.sh_profile
        name: 'Profil: home / away_short / away_long'
      - entity: text.sh_arrival
        name: 'Przyjazd: ISO8601 z przesunięciem UTC'
      - entity: button.sh_return_now
        name: Wracam teraz
      - entity: switch.sh_force_flow_safety_rooms
        name: 'Safety: sypialnia i pokój dziecka'
      - entity: switch.sh_warm_flag
        name: Dogrzanie
      - entity: sensor.sh_actual_mode
        name: Rzeczywisty tryb domu
      - entity: binary_sensor.sh_runtime
        name: Sterownik odpowiada
  - type: grid
    cards:
    - type: markdown
      content: 'Away krótkie obniża cele podłogówki o0,5°C, grzejników o1°C. Away
        wyjazdowe ogranicza je do18°C i17°C. Garaż zachowuje harmonogram.


        Termin wpisz np. `2026-10-25T18:00:00+01:00`. Puste pole anuluje termin. Oszacowanie
        gotowości nie jest gwarancją osiągnięcia celu.'
  - type: grid
    cards:
    - type: entities
      title: Decyzja i potwierdzenie nastawy
      show_header_toggle: false
      entities:
      - entity: sensor.sh_total_wam
        name: WAM
      - entity: sensor.sh_output_offset
        name: Korekta po ograniczeniach
      - entity: sensor.sh_output_setpoint
        name: Żądana nastawa CW400
      - entity: sensor.sh_confirmed_setpoint
        name: Odczytana nastawa CW400
      - entity: sensor.sh_command_status
        name: Potwierdzenie polecenia
      - entity: sensor.sh_output_reasons
        name: Powody decyzji
