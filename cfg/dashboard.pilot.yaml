- title: Diagnostyka
  path: smartheating-debug
  icon: mdi:stethoscope
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: Dom
        icon: mdi:home-thermometer
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating
      - type: button
        name: Plan i powrót
        icon: mdi:calendar-clock
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating-control
      - type: button
        name: Diagnostyka
        icon: mdi:stethoscope
        tap_action:
          action: navigate
          navigation_path: /lovelace/smartheating-debug
    - type: markdown
      content: '## {{ states(''sensor.sh_actual_mode_label'') }}

        **Sterowanie:** {{ states(''sensor.sh_system_status'') }}

        {% set s = ''sensor.sh_system_summary'' %}

        Pomiary: {{ state_attr(s, ''measurements_valid'') }}/{{ state_attr(s, ''measurements_total'')
        }}

        Głowice: {{ state_attr(s, ''trvs_confirmed'') }}/{{ state_attr(s, ''trvs_total'')
        }}

        {% set problems = state_attr(s, ''problems'') %}

        {% if problems %}{% for problem in problems %}

        - {{ problem }}

        {% endfor %}{% endif %}

        {% set manual = state_attr(s, ''manual_overrides'') %}

        {% if manual %}**Ręczne ustawienia: {{ manual }}.**

        Ich termin i powrót do planu znajdziesz przy pokojach.{% endif %}

        '
    - type: entities
      title: Aplikacja i wykonanie
      show_header_toggle: false
      entities:
      - sensor.sh_health
      - binary_sensor.sh_runtime
      - sensor.sh_version
      - sensor.sh_config_id
      - sensor.sh_command_status
      - sensor.sh_energy_issue
  - type: grid
    cards:
    - type: heading
      heading: Decyzja regulatora
      icon: mdi:tune
    - type: entities
      title: Obliczenia
      show_header_toggle: false
      entities:
      - sensor.sh_total_wam
      - sensor.sh_output_offset
      - sensor.sh_forced_burn_offset
      - sensor.sh_output_setpoint
      - sensor.sh_confirmed_setpoint
      - sensor.sh_control_reason
    - type: entities
      title: Funkcje dodatkowe
      show_header_toggle: false
      entities:
      - entity: switch.sh_force_flow_safety_rooms
        name: Ochrona komfortu sypialni i dziecka
      - entity: switch.sh_warm_flag
        name: Dodatkowe dogrzanie +0,5°C
    - type: markdown
      content: Ochrona komfortu może podnieść korektę do +4°C po utrzymującym się
        niedogrzaniu. Działa tylko z poprawnym pomiarem i potwierdzonymi głowicami.
  - type: grid
    cards:
    - type: heading
      heading: Głowice i kocioł
      icon: mdi:radiator
    - type: markdown
      content: '### Zapotrzebowanie i praca kotła

        {% set rooms = state_attr(''sensor.sh_system_summary'', ''requesting_rooms'')
        %}

        **Poniżej celu:** {{ rooms | join('', '') if rooms else ''brak wskazanych
        pokojów'' }}

        **Decyzja sterownika:** {{ states(''sensor.sh_control_reason'') }}

        {% set flame = states(''sensor.boiler_flame_current_2'') %}

        **Palnik:** {% if is_number(flame) %}

        {{ ''wykryty płomień'' if flame | float > 0 else ''brak płomienia'' }}

        {% else %}brak danych{% endif %}

        {% set co = states(''binary_sensor.boiler_heating_active_2'') %}

        {% set cwu = states(''binary_sensor.boiler_tapwater_active_2'') %}

        **CO:** {{ {''on'': ''aktywne'', ''off'': ''nieaktywne''}.get(co, ''brak danych'')
        }}

        **CWU:** {{ {''on'': ''aktywne'', ''off'': ''nieaktywne''}.get(cwu, ''brak
        danych'') }}

        Odczyt nastawy potwierdza ustawienie regulatora. Temperaturę pomieszczenia
        oceniaj osobno.

        '
    - type: entities
      title: Potwierdzenia głowic
      show_header_toggle: false
      entities:
      - sensor.sh_office_trv_status
      - sensor.sh_kidsroom_trv_status
      - sensor.sh_bedroom_trv_status
      - sensor.sh_garage_trv_status
    - type: entities
      title: Odczyty kotła
      show_header_toggle: false
      entities:
      - sensor.boiler_current_flow_temperature_2
      - sensor.boiler_flame_current_2
      - sensor.boiler_energy_heating
      - sensor.boiler_dhw_energy
  - type: grid
    cards:
    - type: heading
      heading: Jakość danych
      icon: mdi:database-check
    - type: entities
      title: Źródła pomiarów
      show_header_toggle: false
      entities:
      - sensor.sh_livingroom_measurement_status
      - sensor.sh_corridor_measurement_status
      - sensor.sh_bathroom_measurement_status
      - sensor.sh_entrance_measurement_status
      - sensor.sh_upper_corridor_measurement_status
      - sensor.sh_wardrobe_measurement_status
      - sensor.sh_upper_bathroom_measurement_status
      - sensor.sh_office_measurement_status
      - sensor.sh_kidsroom_measurement_status
      - sensor.sh_bedroom_measurement_status
      - sensor.sh_garage_measurement_status
  - type: grid
    cards:
    - type: heading
      heading: Historia temperatur i energii
      icon: mdi:chart-line
    - type: history-graph
      title: Sypialnia
      hours_to_show: 24
      entities:
      - entity: sensor.sh_bedroom_temperature
        name: Pomiar
      - entity: sensor.sh_bedroom_target
        name: Cel
    - type: history-graph
      title: Pokój dzieci
      hours_to_show: 24
      entities:
      - entity: sensor.sh_kidsroom_temperature
        name: Pomiar
      - entity: sensor.sh_kidsroom_target
        name: Cel
    - type: history-graph
      title: Łazienka górna
      hours_to_show: 24
      entities:
      - entity: sensor.sh_upper_bathroom_temperature
        name: Pomiar
      - entity: sensor.sh_upper_bathroom_target
        name: Cel
    - type: statistics-graph
      title: Energia CO i CWU — szacunek EMS
      chart_type: bar
      period: day
      days_to_show: 7
      stat_types:
      - change
      entities:
      - entity: sensor.boiler_energy_heating
        name: CO
      - entity: sensor.boiler_dhw_energy
        name: CWU
