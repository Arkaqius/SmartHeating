    - type: markdown
      content: '{% set e = ''climate.sh_livingroom'' %}

        {% if state_attr(e, ''measurement_available'') %}Teraz **{{ state_attr(e,
        ''current_temperature'') }}°C** · {% else %}Brak pomiaru · {% endif %}Cel
        **{{ state_attr(e, ''temperature'') }}°C**


        {{ state_attr(e, ''target_source_label'') or ''Oczekiwanie na dane'' }}{%
        if not state_attr(e, ''measurement_available'') %} · Brak pomiaru{% endif
        %}{% if state_attr(e, ''needs_heat'') %} · Potrzebuje ciepła{% endif %}'
